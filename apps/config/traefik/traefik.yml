global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}
    asDefault: true

core:
  defaultRuleSyntax: "v3"

api:
  dashboard: true

providers:
  docker:
    defaultRule: "Host(`{{ trimSuffix `-homelab` .Name }}.{{ env `DOMAIN_NAME` }}`)"
    exposedByDefault: false
    network: "traefik"
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: "/certs/acme.json"
      dnsChallenge:
        provider: "cloudflare"
        delayBeforeCheck: 10
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
