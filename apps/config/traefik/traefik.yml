global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  # No blanket http->https redirect here: it would upgrade foreign hosts before the
  # catch-all can send them to TRAEFIK_CATCHALL_URL. The redirect is a router
  # (`https-redirect`) scoped to ${DOMAIN_NAME}, defined on the traefik container.
  web:
    address: ":80"
  websecure:
    address: ":443"
    http:
      tls: {}
    asDefault: true
  # Only routers that opt in with `entrypoints: public` listen here. Forward WAN 443 to this
  # port rather than to :443, so a spoofed Host header cannot reach a LAN-only router.
  public:
    address: ":8443"
    http:
      tls: {}

api:
  dashboard: true

providers:
  docker:
    defaultRule: "Host(`{{ trimSuffix `-homelab` .Name }}.{{ env `DOMAIN_NAME` }}`)"
    exposedByDefault: false
    network: "traefik"
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: "/certs/acme.json"
      dnsChallenge:
        provider: "cloudflare"
        delayBeforeCheck: 10
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
