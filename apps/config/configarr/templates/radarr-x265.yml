# "WEB-1080p (x265)" is cloned in config.yml from TRaSH's HD Bluray + WEB and limited here to WEB 1080p.
# x265 at 2000 outranks any x264 WEB-DL (Tier 01 tops out at 1700).
# Streaming services score 0, since the tag says nothing about quality and is often missing.
# LQ is unblocked because it lists most 1080p x265 groups (MeGusta, PSA, Pahe, Tigole).
# The cutoff score is 0, so any accepted release ends upgrades: x265 wins when grabbing, but an x264 already on disk stays.
quality_profiles:
  - name: WEB-1080p (x265)
    upgrade:
      until_quality: WEB 1080p
      until_score: 0
    qualities:
      - name: WEB 1080p
        qualities:
          - WEBDL-1080p
          - WEBRip-1080p

custom_formats:
  - trash_ids:
      - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
    assign_scores_to:
      - name: WEB-1080p (x265)
        score: 2000
