# Seeded into the qbittorrent_data volume once (see apps/media/qbittorrent.yaml).
# qBittorrent owns the file after that; edits here only apply on a fresh volume.
#
# The WebUI login is NOT set here - set QBITTORRENT_PASSWORD in .env and the
# qbittorrent-config container writes WebUI\Username / WebUI\Password_PBKDF2 for
# you on every `docker compose up -d`. Leave it blank to manage the password in
# the qBittorrent UI instead.
[AutoRun]
enabled=false
program=

[BitTorrent]
Session\DefaultSavePath=/media/Downloads
Session\TempPathEnabled=false

[LegalNotice]
Accepted=true

[Preferences]
Connection\UPnP=false
Downloads\SavePath=/media/Downloads
Downloads\TempPathEnabled=false
WebUI\Address=*
WebUI\AuthSubnetWhitelistEnabled=false
WebUI\LocalHostAuth=false
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
WebUI\ServerDomains=*
WebUI\ReverseProxySupportEnabled=true
WebUI\TrustedReverseProxiesList=172.16.0.0/12
