# Mounted over the image's /defaults/qBittorrent.conf, which the image copies into
# the qbittorrent_data volume once. qBittorrent owns the file after that; edits
# here only apply on a fresh volume.
#
# The WebUI login and trusted reverse proxies are NOT set here. webui-login.sh
# writes them from QBITTORRENT_PASSWORD and DOCKER_NETWORK_CIDR on every start.
[AutoRun]
enabled=false
program=

[BitTorrent]
Session\DefaultSavePath=/media/Downloads
Session\TempPathEnabled=false

[LegalNotice]
Accepted=true

[Preferences]
Connection\UPnP=false
Downloads\SavePath=/media/Downloads
Downloads\TempPathEnabled=false
WebUI\Address=*
WebUI\AuthSubnetWhitelistEnabled=false
WebUI\LocalHostAuth=false
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
WebUI\ServerDomains=*
WebUI\ReverseProxySupportEnabled=true
