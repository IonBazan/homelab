# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  traefik:
    container_name: traefik
    image: traefik:3
    profiles: ["traefik"]
    ports:
      - published: 80
        target: 80
        protocol: tcp
        mode: host
      - published: 443
        target: 443
        protocol: tcp
        mode: host
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${CF_API_EMAIL}
      DOMAIN_NAME: ${DOMAIN_NAME}
      TZ: ${TZ}
    volumes:
      - ../config/traefik/rules:/etc/traefik/dynamic:ro
      - ../config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    restart: always
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.websecure.http.middlewares=middlewares-secure-headers@file
      - --certificatesresolvers.letsencrypt.acme.caserver=${LETS_ENCRYPT_ENV:-https://acme-v02.api.letsencrypt.org/directory}
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      traefik.enable: true
      # single wildcard cert served as the default for every router (no per-service certs)
      traefik.tls.stores.default.defaultgeneratedcert.resolver: letsencrypt
      traefik.tls.stores.default.defaultgeneratedcert.domain.main: ${DOMAIN_NAME}
      traefik.tls.stores.default.defaultgeneratedcert.domain.sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.traefik.rule: Host(`${TRAEFIK_SUBDOMAIN:-traefik}.${DOMAIN_NAME}`)
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.entrypoints: websecure
      # basic auth is added only when TRAEFIK_DASHBOARD_AUTH is set (blank = no auth)
      traefik.http.routers.traefik.middlewares: traefik-dashboard-redirect${TRAEFIK_DASHBOARD_AUTH:+,traefik-dashboard-auth}
      traefik.http.middlewares.traefik-dashboard-redirect.redirectregex.regex: ^https://[^/]+/?$$
      traefik.http.middlewares.traefik-dashboard-redirect.redirectregex.replacement: https://${TRAEFIK_SUBDOMAIN:-traefik}.${DOMAIN_NAME}/dashboard/
      traefik.http.middlewares.traefik-dashboard-auth.basicauth.users: ${TRAEFIK_DASHBOARD_AUTH:-}
      # http->https redirect, scoped to ${DOMAIN_NAME} + its subdomains (replaces the
      # blanket entrypoint redirect so foreign hosts stay on :80 for the catch-all).
      traefik.http.routers.https-redirect.rule: HostRegexp(`^(.+\.)?${DOMAIN_NAME}$$`)
      traefik.http.routers.https-redirect.entrypoints: web
      traefik.http.routers.https-redirect.priority: 2
      traefik.http.routers.https-redirect.service: noop@internal
      traefik.http.routers.https-redirect.middlewares: https-redirect
      traefik.http.middlewares.https-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.https-redirect.redirectscheme.permanent: true
      # catch-all: 302 to TRAEFIK_CATCHALL_URL for any Host that is NOT ${DOMAIN_NAME}
      # or a subdomain of it (foreign domains, *.local, bare IP, typos).
      # Blank => empty rule => Traefik skips the router (one benign log line).
      traefik.http.routers.catch-all.rule: ${TRAEFIK_CATCHALL_URL:+PathPrefix(`/`) && !HostRegexp(`^(.+\.)?${DOMAIN_NAME}$$`)}
      traefik.http.routers.catch-all.priority: 1
      traefik.http.routers.catch-all.entrypoints: web,websecure
      traefik.http.routers.catch-all.service: noop@internal
      traefik.http.routers.catch-all.middlewares: catch-all-redirect
      traefik.http.middlewares.catch-all-redirect.redirectregex.regex: .*
      traefik.http.middlewares.catch-all-redirect.redirectregex.replacement: ${TRAEFIK_CATCHALL_URL:-about:blank}
      homepage.group: Network
      homepage.name: Traefik
      homepage.icon: sh-traefik.webp
      homepage.href: https://${TRAEFIK_SUBDOMAIN:-traefik}.${DOMAIN_NAME}/dashboard/
      homepage.description: Reverse proxy

volumes:
  traefik_certs:
