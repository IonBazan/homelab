# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  traefik:
    container_name: traefik
    image: traefik:3
    profiles: ["traefik"]
    ports:
      - published: 80
        target: 80
        protocol: tcp
        mode: host
      - published: 443
        target: 443
        protocol: tcp
        mode: host
    environment:
      CF_API_EMAIL: ${CF_API_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${CF_API_EMAIL}
      DOMAIN_NAME: ${DOMAIN_NAME}
      TZ: ${TZ}
    volumes:
      - ../config/traefik/rules:/etc/traefik/dynamic:ro
      - ../config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    restart: always
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.caserver=${LETS_ENCRYPT_ENV:-https://acme-v02.api.letsencrypt.org/directory}
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      traefik.enable: true
      # single wildcard cert served as the default for every router (no per-service certs)
      traefik.tls.stores.default.defaultgeneratedcert.resolver: letsencrypt
      traefik.tls.stores.default.defaultgeneratedcert.domain.main: ${DOMAIN_NAME}
      traefik.tls.stores.default.defaultgeneratedcert.domain.sans: "*.${DOMAIN_NAME}"
      traefik.http.routers.traefik.rule: Host(`${TRAEFIK_SUBDOMAIN:-traefik}.${DOMAIN_NAME}`)
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.middlewares: traefik-dashboard-redirect
      traefik.http.middlewares.traefik-dashboard-redirect.redirectregex.regex: ^https://[^/]+/?$$
      traefik.http.middlewares.traefik-dashboard-redirect.redirectregex.replacement: https://${TRAEFIK_SUBDOMAIN:-traefik}.${DOMAIN_NAME}/dashboard/
      dockpeek.tags: network

volumes:
  traefik_certs:
