# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  pihole:
    image: pihole/pihole
    container_name: pihole
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    profiles: [pihole]
    ports:
      - 53:53/tcp
      - 53:53/udp
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    environment:
      FTLCONF_misc_dnsmasq_lines: address=/${DOMAIN_NAME}/${PHYSICAL_SERVER_IP}
      FTLCONF_dns_listeningMode: 'all'
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD:-}
    networks:
      - traefik
    volumes:
      - pihole_data:/etc/pihole
    labels:
      traefik.enable: true
      traefik.http.services.pihole.loadbalancer.server.port: 80
      homepage.group: Network
      homepage.name: Pi-hole
      homepage.icon: sh-pi-hole.webp
      homepage.href: //pihole.${DOMAIN_NAME}/admin
      homepage.description: DNS ad blocker
      homepage.widget.type: pihole
      homepage.widget.url: http://pihole
      homepage.widget.key: ${PIHOLE_PASSWORD:-}
      homepage.widget.version: 6

volumes:
  pihole_data:
