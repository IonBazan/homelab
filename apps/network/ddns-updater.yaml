# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  ddns-updater:
    image: qmcgaw/ddns-updater
    container_name: ddns-updater
    volumes:
      - ../config/ddns-updater:/updater/data
    profiles: ["ddns-updater", "network", "basic", "default", "full"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      LISTENING_ADDRESS: ':8000'
      ROOT_URL: /
    networks:
      - traefik
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      traefik.enable: true
      traefik.http.services.ddns-updater.loadbalancer.server.port: 8000
      homepage.group: Network
      homepage.name: DDNS Updater
      homepage.icon: mdi-ip-network-outline
      homepage.href: //ddns-updater.${DOMAIN_NAME}
      homepage.description: Dynamic DNS
