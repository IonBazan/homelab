# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    profiles: ["ollama", "ai", "full"]
    environment:
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - traefik
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      traefik.enable: true
      traefik.http.services.ollama.loadbalancer.server.port: 11434
      homepage.group: AI
      homepage.name: Ollama
      homepage.icon: sh-ollama.webp
      homepage.href: //ollama.${DOMAIN_NAME}
      homepage.description: LLM runtime

volumes:
  ollama_data:
