# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    profiles: ["vpn", "all"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBITTORRENT_PORT:-8081}
    volumes:
      - qbittorrent_data:/config
      - ../config/qbittorrent/qBittorrent.conf:/config/qBittorrent/qBittorrent.conf
      - myMedia:/media
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    # Shares gluetun's network namespace; its Traefik router is defined on the
    # gluetun service (apps/network/gluetun.yaml).
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy

volumes:
  qbittorrent_data:
