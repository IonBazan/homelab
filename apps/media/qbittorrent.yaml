# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    profiles: ["qbittorrent", "vpn", "basic", "default", "full"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8081
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:-}
      TRUSTED_PROXIES: ${DOCKER_NETWORK_CIDR:-172.16.0.0/12}
    volumes:
      - qbittorrent_data:/config
      - myMedia:/media
      - ../config/qbittorrent/qBittorrent.conf:/defaults/qBittorrent.conf:ro
      - ../config/qbittorrent/webui-login.sh:/custom-cont-init.d/webui-login.sh:ro
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # Shares gluetun's network namespace; its Traefik router is defined on the
    # gluetun service (apps/network/gluetun.yaml).
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      homepage.group: Media Management
      homepage.name: qBittorrent
      homepage.icon: sh-qbittorrent.webp
      homepage.href: //qbittorrent.${DOMAIN_NAME}
      homepage.description: Torrent client
      homepage.widget.type: qbittorrent
      homepage.widget.enableLeechProgress: true
      homepage.widget.enableLeechSize: true
      homepage.widget.url: http://gluetun:8081
      homepage.widget.username: ${QBITTORRENT_USERNAME:-admin}
      homepage.widget.password: ${QBITTORRENT_PASSWORD:-}

volumes:
  qbittorrent_data:
