# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    profiles: ["media", "all"]
    init: true
    security_opt:
      - no-new-privileges
    environment:
      TZ: ${TZ}
    volumes:
      - seerr_data:/app/config
    depends_on:
      - radarr
      - sonarr
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.services.seerr.loadbalancer.server.port: 5055
      homepage.group: Media Management
      homepage.name: Seerr
      homepage.icon: sh-seerr.webp
      homepage.href: //seerr.${DOMAIN_NAME}
      homepage.description: Requests
      homepage.widget.type: seerr
      homepage.widget.url: http://seerr:5055
      homepage.widget.key: ${SEERR_API_KEY:-}

volumes:
  seerr_data:
    external: true
