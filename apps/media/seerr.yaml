# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    profiles: ["seerr", "arrs", "media", "basic", "default", "full"]
    init: true
    security_opt:
      - no-new-privileges
    environment:
      TZ: ${TZ}
    volumes:
      - seerr_data:/app/config
    depends_on:
      radarr:
        condition: service_started
        required: false
      sonarr:
        condition: service_started
        required: false
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.services.seerr.loadbalancer.server.port: 5055
      homepage.group: Media Management
      homepage.name: Seerr
      homepage.icon: sh-seerr.webp
      homepage.href: //seerr.${DOMAIN_NAME}
      homepage.description: Requests
      homepage.widget.type: seerr
      homepage.widget.url: http://seerr:5055
      homepage.widget.key: ${SEERR_API_KEY:-}

volumes:
  seerr_data:
