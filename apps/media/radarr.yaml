# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  radarr:
    container_name: radarr
    image: linuxserver/radarr
    profiles: ["radarr", "configarr", "arrs", "media", "basic", "default", "full"]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:-}
    volumes:
      - radarr_data:/config
      - myMedia:/media
    depends_on:
      prowlarr:
        condition: service_started
        required: false
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.services.radarr.loadbalancer.server.port: 7878
      tinyauth.apps.radarr.config.domain: radarr.${DOMAIN_NAME}
      tinyauth.apps.radarr.path.allow: ^/(api|feed|ping)
      homepage.group: Media Management
      homepage.name: Radarr
      homepage.icon: sh-radarr.webp
      homepage.href: //radarr.${DOMAIN_NAME}
      homepage.description: Movies
      homepage.widget.type: radarr
      homepage.widget.url: http://radarr:7878
      homepage.widget.key: ${RADARR_API_KEY:-}
      homepage.widget.enableQueue: true

volumes:
  radarr_data:
