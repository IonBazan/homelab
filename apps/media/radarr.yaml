# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  radarr:
    container_name: radarr
    image: linuxserver/radarr:develop
    profiles: ["radarr", "configarr", "arrs", "media", "basic", "default", "full"]
    deploy:
      resources:
        limits:
          memory: ${RADARR_MEMORY_LIMIT:-1G}
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:-}
      RADARR__AUTH__METHOD: ${TINYAUTH_ENABLED:+External}
      RADARR__SERVER__TRUSTEDNETWORKS: ${DOCKER_NETWORK_CIDR:-172.21.0.0/16}
      RADARR__SERVER__ALLOWEDHOSTS: radarr,radarr.${DOMAIN_NAME},radarr.${TUNNEL_DOMAIN},${PHYSICAL_SERVER_IP}
    volumes:
      - radarr_data:/config
      - ${BACKUP_DIR:?set BACKUP_DIR in .env}/radarr:/config/Backups
      - myMedia:/media
    depends_on:
      prowlarr:
        condition: service_started
        required: false
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - traefik
    labels:
      traefik.enable: true
      traefik.http.services.radarr.loadbalancer.server.port: 7878
      traefik.http.routers.radarr.middlewares: ${TINYAUTH_ENABLED:+tinyauth@docker}
      traefik.http.routers.radarr-tunnel.rule: Host(`radarr.${TUNNEL_DOMAIN}`)
      traefik.http.routers.radarr-tunnel.entrypoints: tunnel
      traefik.http.routers.radarr-tunnel.service: radarr
      tinyauth.apps.radarr.config.domain: radarr.${DOMAIN_NAME}
      tinyauth.apps.radarr.path.allow: ^/(api|feed|ping)
      homepage.group: Media Management
      homepage.name: Radarr
      homepage.icon: sh-radarr.webp
      homepage.href: //radarr.${DOMAIN_NAME}
      homepage.description: Movies
      homepage.widget.type: radarr
      homepage.widget.url: http://radarr:7878
      homepage.widget.key: ${RADARR_API_KEY:-}

volumes:
  radarr_data:
