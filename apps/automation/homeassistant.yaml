# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - hass_data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    profiles: ["automation", "all"]
    restart: ${UNIVERSAL_RESTART_POLICY:-unless-stopped}
    privileged: true
    network_mode: host
    labels:
      traefik.enable: true
      # network_mode: host, so give Traefik an explicit backend instead of relying
      # on Docker network discovery. Router host = defaultRule (homeassistant.${DOMAIN_NAME}).
      traefik.http.services.homeassistant.loadbalancer.server.url: http://host.docker.internal:8123
      homepage.group: Automation
      homepage.name: Home Assistant
      homepage.icon: sh-home-assistant.webp
      homepage.href: //homeassistant.${DOMAIN_NAME}
      homepage.description: Home automation
      homepage.widget.type: homeassistant
      homepage.widget.url: https://homeassistant.${DOMAIN_NAME}
      homepage.widget.key: ${HOMEASSISTANT_TOKEN:-}

volumes:
  hass_data:
